# Testes em todo pull request para a main e em todo push na main; o deploy só roda depois deles passarem
# e só em push na main (ou disparo manual na main): PR nunca publica nada.
# Deploy: gera a imagem Docker, publica no ghcr.io e atualiza o Container App na Azure.
# Login na Azure por OIDC (identidade gh-codeforge-deploy, Contributor só no rg-codeforge): nenhuma senha guardada.
name: Testes e deploy na Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/marcosrbjunior/codeforge
  RESOURCE_GROUP: rg-codeforge
  CONTAINER_APP: codeforge

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Os testes usam PGlite em memória: sem banco, sem segredos. DATABASE_URL vazia conta como ausente.
      DATABASE_URL: ""
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # mesma versão do Dockerfile (node:22-slim)
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes de SRS
        run: npm run test:srs

      - name: Testes de autenticação
        run: npm run test:auth

      - name: Testes dos dados de estudo
        run: npm run test:study

  deploy:
    needs: test
    # Nunca em pull_request: só push na main ou disparo manual a partir da main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: azure-deploy
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXT_BUILD_CPUS=4
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar o Container App
        run: |
          az extension add -n containerapp --upgrade -y --only-show-errors
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --image "$IMAGE:${{ github.sha }}" --only-show-errors \
            --query "properties.latestRevisionName" -o tsv

      - name: Conferir que o app responde
        run: |
          URL="https://$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/login" || true)
            [ "$code" = 200 ] && echo "ok: $URL/login respondeu 200" && exit 0
            sleep 10
          done
          echo "o app não respondeu 200 em /login (último código: $code)"; exit 1
