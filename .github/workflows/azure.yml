# A cada push na main: gera a imagem Docker, publica no ghcr.io e atualiza o Container App na Azure.
# Login na Azure por OIDC (identidade gh-codeforge-deploy, Contributor só no rg-codeforge): nenhuma senha guardada.
name: Deploy na Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: azure-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/marcosrbjunior/codeforge
  RESOURCE_GROUP: rg-codeforge
  CONTAINER_APP: codeforge

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXT_BUILD_CPUS=4
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar o Container App
        run: |
          az extension add -n containerapp --upgrade -y --only-show-errors
          az containerapp update -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --image "$IMAGE:${{ github.sha }}" --only-show-errors \
            --query "properties.latestRevisionName" -o tsv

      - name: Conferir que o app responde
        run: |
          URL="https://$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/login" || true)
            [ "$code" = 200 ] && echo "ok: $URL/login respondeu 200" && exit 0
            sleep 10
          done
          echo "o app não respondeu 200 em /login (último código: $code)"; exit 1
